name: TG Classic Android
on:
  workflow_dispatch:
    inputs:
      test_api:
        description: Use upstream development API credentials for a private preview
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: tg-classic-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TGCLASSIC_API_ID: ${{ secrets.TGCLASSIC_API_ID }}
      TGCLASSIC_API_HASH: ${{ secrets.TGCLASSIC_API_HASH }}
      TGCLASSIC_TEST_API: ${{ inputs.test_api }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/android/local/sdk" >> "$GITHUB_ENV"
          python3 android/setup-sdk.py
      - uses: actions/cache@v4
        with:
          path: android/local/gradle
          key: tg-classic-android-${{ runner.os }}-${{ hashFiles('android/manifest.json') }}
          restore-keys: tg-classic-android-${{ runner.os }}-
      - name: Build arm64 APK with temporary builder signature
        run: python3 android/build.py --sdk "$ANDROID_HOME"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TG-Classic-Android-arm64-builder
          path: artifacts/android/*
          retention-days: 30
          if-no-files-found: error
