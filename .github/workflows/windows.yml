name: TG Classic Windows
on:
  workflow_dispatch:
    inputs:
      test_api:
        description: Use upstream development API credentials for a private preview
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: tg-classic-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      TGCLASSIC_API_ID: ${{ secrets.TGCLASSIC_API_ID }}
      TGCLASSIC_API_HASH: ${{ secrets.TGCLASSIC_API_HASH }}
      TGCLASSIC_TEST_API: ${{ inputs.test_api }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned patched sources
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP 'TGClassicBuild'
          New-Item -ItemType Directory -Force $buildRoot | Out-Null
          "TGCLASSIC_BUILD_ROOT=$buildRoot" | Out-File $env:GITHUB_ENV -Append
          python apply.py --source "$buildRoot/tdesktop"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C "$buildRoot/tdesktop" submodule update --init --recursive --depth 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'
          sdk: '10.0.26100.0'
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: |
            ${{ env.TGCLASSIC_BUILD_ROOT }}/Libraries
            ${{ env.TGCLASSIC_BUILD_ROOT }}/win64/Libraries
            ${{ env.TGCLASSIC_BUILD_ROOT }}/ThirdParty
          key: tg-classic-win64-debug-${{ runner.os }}-${{ hashFiles('manifest.json') }}
          restore-keys: tg-classic-win64-debug-${{ runner.os }}-
      - name: Build Windows x64 Debug and package
        run: ./windows/build.ps1 -Source "$env:TGCLASSIC_BUILD_ROOT/tdesktop" -Destination "$env:GITHUB_WORKSPACE/artifacts/windows"
      - uses: actions/cache/save@v4
        if: always() && steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ env.TGCLASSIC_BUILD_ROOT }}/Libraries
            ${{ env.TGCLASSIC_BUILD_ROOT }}/ThirdParty
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TG-Classic-Windows-x64
          path: |
            artifacts/windows/TG-Classic-Windows-x64.zip
            artifacts/windows/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
